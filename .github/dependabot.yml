version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
    groups:
      # Angular framework, CLI/build tooling and ESLint packages are released
      # in lockstep, so bump them in a single PR.
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
          - "angular-eslint"
        update-types:
          - "minor"
          - "patch"
      # Everything else: one PR for minor/patch bumps. Major updates are left
      # out of the group so they still arrive individually for review.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@angular/*"
          - "@angular-eslint/*"
          - "angular-eslint"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
