@if (selectable$ | async) {
  <mat-checkbox
    [checked]="checked"
    [indeterminate]="indeterminate"
    (change)="handleChange($event.checked)" color="primary">
    <ng-container *ngTemplateOutlet="templateOutlet"></ng-container>
  </mat-checkbox>
} @else {
  <ng-container *ngTemplateOutlet="templateOutlet"></ng-container>
}


<ng-template #templateOutlet>
  <div class="label">
    <ng-content></ng-content>
  </div>
</ng-template>
