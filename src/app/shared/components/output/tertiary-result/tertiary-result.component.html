@if (result) {
  <div class="container">
    @if (selectable$ | async) {
      <div class="select-btn">
        <button mat-stroked-button (click)="select()">{{ isSelected() ? 'Unselect' : 'Select' }} data on this panel</button>
      </div>
    }
    <p>{{ getDescription(result.params) }}</p>
    @for (model of result.output.models; track model; let i = $index) {
      <app-tertiary-model-output
        [(ngModel)]="value.fields[i]"
        [model]="model">
      </app-tertiary-model-output>
    }
  </div>
}
