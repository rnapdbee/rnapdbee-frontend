<div class="triples-table" *ngIf="triples?.length; else empty">
  <table>
    <thead>
      <tr>
        <th *ngFor="let col of columns">{{ col }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of triples; let i = index; trackBy: trackByIndex">
        <td *ngFor="let col of columns">{{ formatValue(cellValue(t, col)) }}</td>
      </tr>
    </tbody>
  </table>
</div>

<ng-template #empty>
  <div class="no-triples">No triples available</div>
</ng-template>
