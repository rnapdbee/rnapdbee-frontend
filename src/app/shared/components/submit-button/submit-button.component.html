<div class="submit">
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="disabled || loading">
    <div class="btn-content">
      @if (!loading) {
        <span>Run</span>
      } @else {
        <mat-spinner [diameter]="20"></mat-spinner>
      }
    </div>
  </button>
</div>
